name: Build

# Trigger when a pull request is received
on:
  pull_request:
  workflow_dispatch:

env:
  # The toolchain CLAUDE.md requires for local builds. Ubuntu's packaged
  # gcc-arm-none-eabi is a different compiler, and a different compiler moves
  # code and data around, which is exactly how latent layout bugs surface.
  ARM_TOOLCHAIN_VERSION: 14.2.rel1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install the build tools
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake build-essential

    - name: Cache the ARM GNU Toolchain
      id: arm-toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

    - name: Download the ARM GNU Toolchain
      if: steps.arm-toolchain.outputs.cache-hit != 'true'
      run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

    - name: Use the ARM GNU Toolchain
      run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          echo "PICO_TOOLCHAIN_PATH=$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_ENV"

    - name: Show the compiler version
      run: arm-none-eabi-gcc --version

    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.0.0/install_atarist_toolkit_docker.sh | bash

    - name: Run - remove interactive
      run: sed -i 's/-it//' /usr/local/bin/stcmd

    - name: Build PICO_W ${{ matrix.build_type }} version
      env:
        APP_UUID: ${{ secrets.APP_UUID }}
      run: ./build.sh pico_w ${{ matrix.build_type }} ${APP_UUID:-44444444-4444-4444-8444-444444444444}

    - name: Size report
      run: python3 .github/scripts/firmware_size_report.py rp/build/rp.elf rp/build/rp.elf.map "${{ matrix.build_type }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the firmware and its symbols
      uses: actions/upload-artifact@v4
      with:
        name: md-devops-${{ matrix.build_type }}
        path: |
          dist/*
          rp/build/rp.elf
          rp/build/rp.elf.map
        if-no-files-found: error
