name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same toolchain as build.yml and as local builds (see the note there).
  ARM_TOOLCHAIN_VERSION: 14.2.rel1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install the build tools
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake build-essential

    - name: Cache the ARM GNU Toolchain
      id: arm-toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

    - name: Download the ARM GNU Toolchain
      if: steps.arm-toolchain.outputs.cache-hit != 'true'
      run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

    - name: Use the ARM GNU Toolchain
      run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          echo "PICO_TOOLCHAIN_PATH=$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_ENV"

    - name: Show the compiler version
      run: arm-none-eabi-gcc --version

    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.0.0/install_atarist_toolkit_docker.sh | bash

    - name: Run - remove interactive
      run: sed -i 's/-it//' /usr/local/bin/stcmd

    - name: Install dependencies
      run: |
        pip install boto3

    - name: Run - Build PICO_W release version
      env:
        APP_UUID: ${{ secrets.APP_UUID }}
      run: ./build.sh pico_w release ${APP_UUID:-44444444-4444-4444-8444-444444444444}

    - name: Size report
      run: python3 .github/scripts/firmware_size_report.py rp/build/rp.elf rp/build/rp.elf.map release >> "$GITHUB_STEP_SUMMARY"

    - name: Get current date
      id: build
      run: echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_OUTPUT"

    - name: Get version from version.txt
      id: get_version
      run: echo "RELEASE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

    - name: Read partial CHANGELOG.md content
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        awk '/^---$/ { exit } { print }' CHANGELOG.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Copy release artifacts
      run: |
        mkdir -p release symbols
        cp dist/*.uf2 release/
        cp dist/*.json release/
        # Symbols go to the GitHub release only, never to the S3 bucket.
        cp rp/build/rp.elf "symbols/md-devops-${RELEASE_VERSION}.elf"
        cp rp/build/rp.elf.map "symbols/md-devops-${RELEASE_VERSION}.elf.map"

    - name: Upload the binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release/*
        tag: ${{ github.ref }}
        release_name: ${{ env.RELEASE_VERSION }}
        body: |
          **Release Notes:**
          - Build Date: ${{ steps.build.outputs.date }}
          - Version: ${{ env.RELEASE_VERSION }}

          ${{ env.CHANGELOG }}
        file_glob: true
        overwrite: true
        make_latest: true

    - name: Upload the symbols to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: symbols/*
        tag: ${{ github.ref }}
        file_glob: true
        overwrite: true

    - name: Upload artifacts to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1  # or your bucket's region
      run: |
        python3 <<EOF
        import os
        import boto3

        s3 = boto3.client('s3')
        release_dir = 'release'
        bucket_name = 'atarist.sidecartridge.com'

        for filename in os.listdir(release_dir):
            local_path = os.path.join(release_dir, filename)
            s3_path = filename  # uploaded at root of the bucket
            print(f"Uploading {local_path} to s3://{bucket_name}/{s3_path}")
            s3.upload_file(local_path, bucket_name, s3_path)
        EOF
